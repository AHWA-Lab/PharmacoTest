<meta property="og:title" content="약침 성격 처방">

<style>
/* Layout: 한 문항씩 넘기는 좁은 단일 컬럼. 결과는 약침 바이알 라벨 형태의 카드. */
:root {
  /* 파스텔 팔레트: 민트·라벤더·피치. 다크 모드에서도 밝게 유지 */
  --bg: #f6f3fb;
  --bg-grad: linear-gradient(160deg, #fdeef4 0%, #eef1fd 45%, #e9f8f1 100%);
  --surface: #ffffff;
  --ink: #3a3550;
  --muted: #7d7896;
  --line: #e2dcf0;
  --cap: #a8e0c8;
  --cap-ink: #24493b;
  --amber: #f2a488;
  --lav: #cfc4f2;
  --font-display: "Noto Serif KR", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed;
  min-height: 100vh; color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 540px; margin: 0 auto; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 0 0 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* start */
.start h1 { font-size: clamp(34px, 9vw, 46px); line-height: 1.15; font-weight: 900; }
.start p.lead { color: var(--muted); margin: 16px 0 28px; max-width: 34em; }
.spec { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 28px; padding: 0; list-style: none; }
.spec li { border: 1px solid var(--line); background: #f3effd; padding: 4px 10px; font-size: 13px; color: var(--muted); border-radius: 3px; }
.go {
  background: var(--cap); color: var(--cap-ink); border: 0; border-radius: 999px;
  padding: 14px 28px; box-shadow: 0 4px 14px rgba(120, 190, 160, .35); font-weight: 700; font-size: 16px; letter-spacing: .04em;
}
.go:hover { filter: brightness(1.08); }

/* quiz */
.rack { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; margin-bottom: 8px; }
.rack i { height: 22px; border: 1.5px solid var(--line); border-radius: 3px 3px 7px 7px; background: rgba(255,255,255,.7); position: relative; }
.rack i::before { content: ""; position: absolute; left: 20%; right: 20%; top: -5px; height: 4px; background: var(--line); border-radius: 1px; }
.rack i.done { background: var(--cap); border-color: var(--cap); }
.rack i.done::before { background: var(--cap); }
.rack i.now { border-color: var(--amber); }
.rack i.now::before { background: var(--amber); }
.count { font-size: 13px; color: var(--muted); margin: 0 0 36px; font-variant-numeric: tabular-nums; }
.q-title { font-size: 12px; letter-spacing: .14em; color: #d9805f; margin: 0 0 14px; font-weight: 700; }
.choices { display: grid; gap: 12px; }
.choice {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 2px 10px rgba(150, 130, 200, .10);
  padding: 32px 20px; font-size: 17px; line-height: 1.5; min-height: 112px; width: 100%;
  transition: border-color .15s, transform .15s;
}
.vs { text-align: center; font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: .08em; color: #d9805f; margin: -2px 0; }
.choice:hover { border-color: var(--lav); background: #faf8ff; }
.choice:active { transform: scale(.99); }
.back { margin-top: 22px; background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.back[disabled] { visibility: hidden; }

/* result */
.label {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px rgba(150, 130, 200, .16); overflow: hidden;
}
.label-cap { background: var(--cap); color: var(--cap-ink); display: flex; justify-content: space-between; gap: 12px; padding: 10px 18px; font-size: 12px; letter-spacing: .1em; }
.label-body { padding: 22px 18px 20px; }
.cat { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
.vial-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 10vw, 46px); line-height: 1.2; margin: 0 0 18px; text-wrap: balance; }
.character-frame {
  width: min(100%, 330px); aspect-ratio: 1; margin: 0 auto 20px; overflow: hidden;
  border: 1px solid #eee7dc; border-radius: 22px; background: #fffaf1;
  box-shadow: inset 0 0 0 6px rgba(255,255,255,.5), 0 5px 18px rgba(100,80,65,.10);
}
.character {
  width: 100%; height: 100%; background-image: url("assets/personality-characters.png");
  background-size: 400% 400%; background-repeat: no-repeat;
}
.you { font-size: 18px; line-height: 1.6; margin: 0 0 20px; }
.you b { font-weight: 700; background: linear-gradient(transparent 60%, #fde0d4 60%); }
.type-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 16px; }
.code { font-family: var(--font-body); font-weight: 500; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.nick { font-family: var(--font-display); font-size: clamp(28px, 8vw, 38px); font-weight: 900; color: var(--ink); line-height: 1.3; }
.label .type-row { margin-bottom: 20px; }
.bars { display: grid; gap: 10px; margin: 22px 0 0; }
.bar { display: grid; grid-template-columns: 2.2em 1fr 2.2em; align-items: center; gap: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar .l { font-weight: 700; }
.bar .r { text-align: right; font-weight: 700; }
.track { display: flex; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.track span { background: linear-gradient(90deg, var(--cap), var(--lav)); display: block; }
.dim { color: var(--muted); font-weight: 400; }
.foot { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.ghost { background: var(--surface); border: 1.5px solid var(--lav); border-radius: 999px; padding: 12px 20px; font-weight: 500; }
.share-row { margin-top: 14px; }
.ghost:hover { background: #f3effd; }
.feedback { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
.feedback button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 50%; width: 52px; height: 52px; padding: 0; font-size: 26px; }
.feedback button:hover { border-color: var(--lav); }
.feedback button[aria-pressed="true"] { background: #e9f8f1; border-color: #5fae8e; box-shadow: 0 0 0 2px rgba(95,174,142,.18); }
.bottom-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 28px; }
.bottom-nav .ghost { min-width: 0; padding: 12px 2px; font-size: clamp(12px, 3.2vw, 15px); white-space: nowrap; }
.bottom-nav [aria-current="page"] { background: var(--cap); border-color: var(--cap); color: var(--cap-ink); }
.bottom-nav button:disabled { opacity: .45; cursor: default; }
main:has(.types-page) { max-width: 960px; }
.types-page h1 { font-size: clamp(24px, 6vw, 36px); margin-bottom: 24px; }
.types-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2vw, 18px); }
.type-tile { display: flex; flex-direction: column; min-width: 0; padding: clamp(6px, 2vw, 16px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.type-tile .character-frame { width: 100%; margin-bottom: 10px; border-radius: 10px; }
.type-icon { display: block; padding: 0; cursor: pointer; }
.tile-code { font-weight: 700; color: #43866d; font-size: clamp(12px, 2.5vw, 19px); }
.tile-name { font-size: clamp(11px, 2vw, 16px); margin: 4px 0; overflow-wrap: anywhere; }
.tile-nick { font-size: clamp(10px, 1.8vw, 13px); color: var(--muted); margin: 0 0 12px; }
.satisfaction-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin-top: auto; }
.satisfaction-bar .positive { background: #66bb8a; }
.satisfaction-bar .negative { background: #eb8585; }
.satisfaction-bar.no-data { opacity: .35; }
.type-tile:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.satisfaction-tooltip { max-width: min(360px, calc(100vw - 24px)); white-space: pre-line; line-height: 1.65; overflow: hidden; position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: white; border-radius: 8px; padding: 7px 11px; font-size: 13px; box-shadow: 0 3px 12px #0002; }
.stats-page h1 { font-size: clamp(24px, 6vw, 36px); margin-bottom: 24px; }
.stats-list { display: grid; gap: 14px; margin-bottom: 24px; }
.stats-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 16px; }
.stats-icon { width: 72px; height: 72px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fffaf1; }
.stats-track { height: 16px; background: #e2ece6; border-radius: 999px; overflow: hidden; }
.stats-fill { display: block; height: 100%; background: #66bb8a; border-radius: inherit; }
.stats-value { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
.type-dialog { width: min(420px, calc(100% - 32px)); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 52px 24px 28px; border: 1px solid var(--line); border-radius: 22px; color: var(--ink); background: var(--surface); box-shadow: 0 18px 60px #211c3540; }
.type-dialog::backdrop { background: #211c3566; }
.dialog-close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f3effd; font-size: 24px; line-height: 1; }
.type-dialog h2 { font-size: clamp(28px, 8vw, 36px); margin: 16px 0 10px; }
.type-dialog p { margin-bottom: 0; }
.type-description { border-top: 1px dashed var(--line); margin-top: 22px; padding-top: 4px; font-size: 15px; line-height: 1.85; word-break: keep-all; overflow-wrap: break-word; }
.type-description p { margin: 16px 0 0; }
.type-tile.last-result, .stats-icon.last-result { outline: 5px solid #36a66c; outline-offset: 3px; box-shadow: 0 0 0 8px #36a66c20; }
.stats-avatar { min-width: 0; }
.stats-avatar .satisfaction-bar { margin-top: 10px; width: 72px; }
.feedback button:disabled { cursor: default; opacity: .45; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

      "달 위에서 이야기를 적는 양처럼, 눈앞의 일상 너머에 나만의 의미와 장면을 그리는 편이에요. 사소한 말이나 풍경에도 오래 마음이 머물고, 그 느낌을 상상과 이야기로 바꾸며 감정을 가라앉히곤 해요. 부드럽고 조용해 보여도 소중하게 여기는 가치만큼은 쉽게 타협하지 않아요.",
      "혼자만의 세계가 편하면서도 그 안쪽을 알아봐 주는 사람과 깊이 연결되고 싶은 마음이 있어요. 남의 감정에는 너그러우면서 정작 내 실수나 어색했던 순간은 여러 번 되짚기도 해요. 모든 마음을 완벽한 문장으로 설명하지 않아도, 당신의 진심은 작은 선택과 다정한 행동 속에 이미 드러나 있어요."
    ]
  };

  function typeDescriptionMarkup(code) {
    return '<div class="type-description">' + TYPE_DESCRIPTIONS[code].map(function (paragraph) {
      return '<p>' + paragraph + '</p>';
    }).join('') + '</div>';
  }

  // 4×4 스프라이트 시트: RESULTS와 같은 16개 유형을 행 우선으로 배치합니다.
  var CHARACTER_POSITIONS = {
    ESTJ: [0, 0], ESTP: [1, 0], ESFJ: [2, 0], ESFP: [3, 0],
    ENTJ: [0, 1], ENTP: [1, 1], ENFJ: [2, 1], ENFP: [3, 1],
    ISTJ: [0, 2], ISTP: [1, 2], ISFJ: [2, 2], ISFP: [3, 2],
    INTJ: [0, 3], INTP: [1, 3], INFJ: [2, 3], INFP: [3, 3]
  };

  var PER_AXIS = 4;
  var app = document.getElementById("app");
  var state = { qs: [], i: 0, ans: [], resultId: null, vote: null };
  var lastResultType = null;
  try { lastResultType = localStorage.getItem('pharmaco-last-type'); } catch (error) {}

  var savedResult = null;
  try {
    var cached = JSON.parse(localStorage.getItem('pharmaco-last-result') || 'null');
    if (cached && Object.prototype.hasOwnProperty.call(RESULTS, cached.code)) {
      var validTally = Array.isArray(cached.tally) && cached.tally.length === 4 && cached.tally.every(function (t) {
        return t && Number.isInteger(t.a) && Number.isInteger(t.b) && t.a >= 0 && t.b >= 0 && t.a + t.b === PER_AXIS;
      });
      savedResult = { code: cached.code, tally: validTally ? cached.tally : null, resultId: validTally ? cached.resultId : null, vote: cached.vote === 1 || cached.vote === -1 ? cached.vote : null };
    }
  } catch (error) {}
  if (!savedResult && Object.prototype.hasOwnProperty.call(RESULTS, lastResultType)) savedResult = { code: lastResultType, tally: null };

  function rememberResult(code, tally) {
    lastResultType = code;
    savedResult = { code: code, tally: tally || null, resultId: tally ? state.resultId : null, vote: tally ? state.vote : null };
    try {
      localStorage.setItem('pharmaco-last-type', code);
      localStorage.setItem('pharmaco-last-result', JSON.stringify(savedResult));
    } catch (error) {}
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildQuiz() {
    var qs = [];
    AXES.forEach(function (ax, ai) {
      shuffle(ax.pool).slice(0, PER_AXIS).forEach(function (p) {
        qs.push({ axis: ai, flip: Math.random() < 0.5, text: p });
      });
    });
    state.qs = shuffle(qs);
    state.i = 0;
    state.ans = [];
    state.resultId = window.PharmacoStats.id();
    state.vote = null;
  }

  var viewVersion = 0;
  function el(html) {
    viewVersion++;
    var page = html.indexOf('class="start"') >= 0 ? 'start' : html.indexOf('class="label"') >= 0 ? 'result' : html.indexOf('class="types-page"') >= 0 ? 'types' : html.indexOf('class="stats-page"') >= 0 ? 'stats' : null;
    var links = [ ['restart', '다시하기', 'start'], ['result', '결과보기', 'result'], ['types', '전체보기', 'types'], ['stats', '통계보기', 'stats'] ];
    var nav = page ? '<nav class="bottom-nav" aria-label="화면 이동">' + links.map(function (link) {
      return '<button type="button" class="ghost" id="nav-' + link[0] + '"' + (page === link[2] ? ' aria-current="page"' : '') + (link[0] === 'result' && !savedResult ? ' disabled title="테스트를 완료하면 결과를 볼 수 있어요"' : '') + '>' + link[1] + '</button>';
    }).join('') + '</nav>' : '';
    app.innerHTML = html + nav;
    if (page) {
      document.getElementById('nav-restart').onclick = function () {
        history.replaceState(null, '', BASE);
        buildQuiz(); renderQ(); window.scrollTo(0, 0);
      };
      document.getElementById('nav-result').onclick = function () {
        if (!savedResult) return;
        state.resultId = savedResult.resultId;
        state.vote = savedResult.vote;
        renderResult(savedResult.code, savedResult.tally); window.scrollTo(0, 0);
      };
      document.getElementById('nav-types').onclick = function () { renderAllTypes(null); };
      document.getElementById('nav-stats').onclick = function () { renderTypeStats(null); };
    }
  }

  function renderStart() {
    el(
      '<section class="start">' +
      '<p class="eyebrow">일반한약팀 · 심리 처방</p>' +
      '<h1>약침 성격 처방</h1>' +
      '<p class="lead">16개 문항에 둘 중 가까운 쪽을 고르면 나와 닮은 약침이 조제됩니다. 문항은 풀에서 무작위로 뽑혀서 할 때마다 달라요.</p>' +
      '<ul class="spec"><li>1회 16문항</li><li>약 1분</li><li>결과 16종</li></ul>' +
      '<div class="actions"><button class="go" id="go">조제 시작</button><button class="ghost" id="share">친구에게 공유</button></div>' +
      '</section>'
    );
    document.getElementById("go").onclick = function () { buildQuiz(); renderQ(); };
    var shareBtn = document.getElementById("share");
    shareBtn.onclick = function () { share(shareBtn, "약침 성격 처방", "16문항으로 알아보는 나와 닮은 약침", BASE); };
  }

  function renderQ() {
    var q = state.qs[state.i];
    var opts = q.flip ? [1, 0] : [0, 1];
    var rack = "";
    for (var k = 0; k < state.qs.length; k++) {
      rack += '<i class="' + (k < state.i ? "done" : k === state.i ? "now" : "") + '"></i>';
    }
    var btns = opts.map(function (o) {
      return '<button class="choice" data-pick="' + o + '">' + q.text[o] + '</button>';
    }).join('<div class="vs" aria-hidden="true">VS</div>');
    el(
      '<section>' +
      '<div class="rack" aria-hidden="true">' + rack + '</div>' +
      '<p class="count">' + (state.i + 1) + ' / ' + state.qs.length + '</p>' +
      '<p class="q-title">둘 중 나와 가까운 쪽</p>' +
      '<div class="choices">' + btns + '</div>' +
      '<button class="back" id="back"' + (state.i === 0 ? " disabled" : "") + '>이전 문항</button>' +
      '</section>'
    );
    Array.prototype.forEach.call(app.querySelectorAll(".choice"), function (b) {
      b.onclick = function () { answer(parseInt(b.getAttribute("data-pick"), 10)); };
    });
    document.getElementById("back").onclick = function () {
      if (state.i > 0) { state.i--; state.ans.pop(); renderQ(); }
    };
  }

  function answer(pick) {
    state.ans.push(pick);
    state.i++;
    if (state.i >= state.qs.length) {
      var res = scoreResult();
      window.PharmacoStats.record(state.resultId, res.code, null);
      renderResult(res.code, res.tally);
    } else renderQ();
  }

  var BASE = location.origin + location.pathname;

  function share(btn, title, text, url) {
    var label = btn.textContent;
    var flash = function (msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = label; }, 1800); };
    if (navigator.share) {
      navigator.share({ title: title, text: text, url: url }).catch(function () {});
      return;
    }
    try {
      navigator.clipboard.writeText(text + "\n" + url).then(function () { flash("링크 복사됨"); }, function () { flash("복사 불가"); });
    } catch (e) { flash("복사 불가"); }
  }

  function scoreResult() {
    var tally = AXES.map(function () { return { a: 0, b: 0, last: "a" }; });
    state.qs.forEach(function (q, idx) {
      var side = state.ans[idx] === 0 ? "a" : "b";
      tally[q.axis][side]++;
      tally[q.axis].last = side;
    });
    var code = "";
    AXES.forEach(function (ax, i) {
      var t = tally[i];
      var side = t.a > t.b ? "a" : t.b > t.a ? "b" : t.last;
      code += ax[side];
    });
    return { code: code, tally: tally };
  }

  function renderResult(code, tally) {
    rememberResult(code, tally);
    var shared = !tally;
    var r = RESULTS[code];
    var pos = CHARACTER_POSITIONS[code];
    var characterStyle = "background-position:" + (pos[0] * 100 / 3) + "% " + (pos[1] * 100 / 3) + "%";
    var detail = "";
    if (!shared) {
      var bars = AXES.map(function (ax, i) {
        var t = tally[i];
        var pa = (t.a / PER_AXIS) * 100;
        return '<div class="bar"><span class="l">' + ax.a + '</span>' +
          '<div class="track" role="img" aria-label="' + ax.aName + ' ' + t.a + ', ' + ax.bName + ' ' + t.b + '"><span style="width:' + pa + '%"></span></div>' +
          '<span class="r">' + ax.b + '</span></div>';
      }).join("");
      var scoreLine = AXES.map(function (ax, i) {
        return ax.aName + ' ' + tally[i].a + ':' + tally[i].b + ' ' + ax.bName;
      }).join(" · ");
      detail = '<div class="bars">' + bars + '</div><p class="foot">' + scoreLine + '</p>';
    }

    el(
      '<section>' +
      '<p class="eyebrow">' + (shared ? "친구가 받은 처방" : "조제 완료") + '</p>' +
      '<article class="label">' +
        '<div class="label-cap"><span>' + r[1] + '</span><span>1BOX = 2ml × 5 vial</span></div>' +
        '<div class="label-body">' +
          '<p class="cat">' + (shared ? "이 사람의 약침" : "당신의 약침") + '</p>' +
          '<div class="character-frame result-icon" tabindex="0" data-code="' + code + '" role="img" aria-label="' + r[2] + ' ' + r[0] + ' 캐릭터">' +
            '<div class="character" style="' + characterStyle + '"></div>' +
          '</div>' +
          '<h2 class="vial-name">' + r[2] + '</h2>' +
          '<div class="type-row"><span class="nick">' + r[0] + '</span><span class="code">' + code + '</span></div>' +
          '<p class="you">' + (shared ? "" : "당신은 ") + '<b>' + r[3] + '</b> 타입입니다.</p>' +
          detail +
          typeDescriptionMarkup(code) +
        '</div>' +
      '</article>' +
      '<p class="foot">이름과 재료를 억지로 연결한 재미용 매칭입니다. 실제 효능과는 관계가 없습니다.</p>' +
      '<div class="feedback" role="group" aria-label="이 결과가 내 성격에 부합하나요?">' +
        '<button type="button" aria-label="내 성격에 부합해요" aria-pressed="false">👍</button>' +
        '<button type="button" aria-label="내 성격에 부합하지 않아요" aria-pressed="false">👎</button>' +
      '</div>' +
      (!shared ? '<p class="foot" id="feedback-status" role="status"></p>' : '') +
      '<div class="satisfaction-tooltip" id="result-tooltip" role="tooltip" hidden></div></section>'
    );
    setupTypeTooltips(document.getElementById('result-tooltip'), '.result-icon');
    var feedbackButtons = app.querySelectorAll(".feedback button");
    Array.prototype.forEach.call(feedbackButtons, function (button, index) {
      var vote = index === 0 ? 1 : -1;
      button.disabled = shared;
      button.setAttribute('aria-pressed', String(!shared && state.vote === vote));
      button.onclick = function () {
        if (shared) return;
        var wasPressed = button.getAttribute("aria-pressed") === "true";
        Array.prototype.forEach.call(feedbackButtons, function (item) {
          item.setAttribute("aria-pressed", "false");
        });
        button.setAttribute("aria-pressed", String(!wasPressed));
        state.vote = wasPressed ? null : vote;
        rememberResult(code, tally);
        var statusNode = document.getElementById('feedback-status');
        statusNode.textContent = '평가 저장 중…';
        window.PharmacoStats.record(state.resultId, code, state.vote).then(function (saved) {
          statusNode.textContent = saved ? '평가가 반영되었습니다.' : '평가를 보관했습니다. 통계 연결 시 다시 전송합니다.';
        });
      };
    });
  }

  // 공용 집계 연결 전에는 빈 데이터로 유지합니다. 형식: { ESTJ: { up: 8, down: 2 } }
  var satisfactionStats = {};



  function satisfaction(code) {
    var stats = satisfactionStats[code];
    var total = stats ? stats.up + stats.down : 0;
    var percent = total ? Math.round(stats.up / total * 100) : null;
    var label = percent === null ? '만족도: 집계 전' : '만족도 ' + percent + '% · 불만족 ' + (100 - percent) + '%';
    var width = percent === null ? 50 : percent;
    return { label: label, bar: '<div class="satisfaction-bar' + (percent === null ? ' no-data' : '') + '" tabindex="0" role="img" data-satisfaction="' + label + '" aria-label="' + label + '"><span class="positive" style="width:' + width + '%"></span><span class="negative" style="width:' + (100 - width) + '%"></span></div>' };
  }

  function statsNotice() {
    var status = window.PharmacoStats.status();
    if (status === 'unconfigured') return '공용 통계 연결 전입니다.';
    if (status === 'error') return '통계를 불러오지 못했습니다. 다시 들어오면 재시도합니다.';
    if (status === 'pending') return '일부 결과의 전송을 기다리고 있습니다.';
    if (status === 'loading') return '통계를 불러오는 중…';
    return '';
  }

  function refreshStatsView(render) {
    var version = viewVersion;
    window.PharmacoStats.refresh().then(function (rows) {
      if (rows) {
        typeResultCounts = {};
        satisfactionStats = {};
        rows.forEach(function (row) {
          if (!Object.prototype.hasOwnProperty.call(RESULTS, row.code)) return;
          typeResultCounts[row.code] = Number(row.result_count);
          satisfactionStats[row.code] = { up: Number(row.up_count), down: Number(row.down_count) };
        });
      }
      if (version === viewVersion && !document.getElementById('type-dialog').open) render();
    });
  }

  function setupTypeTooltips(tooltip, iconSelector) {
    function bind(element, content) {
      function show(x, y) {
        tooltip.textContent = content();
        tooltip.hidden = false;
        tooltip.style.maxHeight = Math.max(60, window.innerHeight - y - 26) + 'px';
        tooltip.style.left = Math.max(8, Math.min(x, window.innerWidth - tooltip.offsetWidth - 8)) + 'px';
        tooltip.style.top = Math.max(8, Math.min(y + 18, window.innerHeight - tooltip.offsetHeight - 8)) + 'px';
      }
      element.onpointermove = function (event) { show(event.clientX, event.clientY); };
      element.onpointerleave = element.onblur = function () { tooltip.hidden = true; };
      element.onfocus = function () { var rect = element.getBoundingClientRect(); show(rect.left, rect.bottom); };
    }
    Array.prototype.forEach.call(app.querySelectorAll(iconSelector), function (icon) {
      bind(icon, function () {
        var code = icon.getAttribute('data-code'), r = RESULTS[code];
        return r[2] + ' · ' + r[0] + '\n\n' + TYPE_DESCRIPTIONS[code].join('\n\n');
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('.satisfaction-bar'), function (bar) {
      bind(bar, function () { return bar.getAttribute('data-satisfaction'); });
      bar.onclick = bar.onfocus;
    });
  }

  function typeDialogMarkup() {
    return '<dialog class="type-dialog" id="type-dialog" aria-labelledby="dialog-type-name"><button type="button" class="dialog-close" id="dialog-close" aria-label="닫기">×</button><div id="dialog-content"></div></dialog>';
  }

  function setupTypeDialog(tooltip) {
    var dialog = document.getElementById('type-dialog');
    document.getElementById('dialog-close').onclick = function () { dialog.close(); };
    dialog.onclose = function () { tooltip.hidden = true; };
    return function (code) {
        tooltip.hidden = true;
        var r = RESULTS[code], pos = CHARACTER_POSITIONS[code];
        document.getElementById('dialog-content').innerHTML = '<div class="character-frame" role="img" aria-label="' + r[2] + ' 캐릭터"><div class="character" style="background-position:' + (pos[0] * 100 / 3) + '% ' + (pos[1] * 100 / 3) + '%"></div></div>' +
          '<h2 id="dialog-type-name">' + r[2] + '</h2><div class="type-row"><span class="nick">' + r[0] + '</span><span class="code">' + code + '</span></div><p class="cat">' + r[1] + '</p><p>' + r[3] + ' 타입입니다.</p>' + typeDescriptionMarkup(code);
        dialog.showModal();
    };
  }

  function renderAllTypes(back, refreshed) {
    var tiles = Object.keys(RESULTS).map(function (code) {
      var r = RESULTS[code];
      var pos = CHARACTER_POSITIONS[code];
      var sat = satisfaction(code), label = sat.label;
      return '<article class="type-tile' + (code === lastResultType ? ' last-result' : '') + '" aria-label="' + code + ' ' + r[2] + '">' +
        '<button type="button" class="character-frame type-icon" data-code="' + code + '" aria-label="' + r[2] + ' 상세 보기"><div class="character" style="background-position:' + (pos[0] * 100 / 3) + '% ' + (pos[1] * 100 / 3) + '%"></div></button>' +
        '<span class="tile-code">' + code + '</span><h2 class="tile-name">' + r[2] + '</h2><p class="tile-nick">' + r[0] + '</p>' +
        sat.bar + '</article>';
    }).join("");
    el('<section class="types-page"><h1>약침타입 전체보기</h1><div class="types-grid">' + tiles + '</div>' +
      '<p class="foot">' + statsNotice() + '</p>' +
      '<p class="foot">초록: 만족 · 빨강: 불만족. 흐린 막대는 아직 집계된 평가가 없는 타입입니다.</p>' +
      '<div class="satisfaction-tooltip" id="satisfaction-tooltip" role="tooltip" hidden></div>' + typeDialogMarkup() + '</section>');
    var tooltip = document.getElementById("satisfaction-tooltip");
    var openTypeDialog = setupTypeDialog(tooltip);
    Array.prototype.forEach.call(app.querySelectorAll('.type-icon'), function (button) {
      button.onclick = function (event) { event.stopPropagation(); openTypeDialog(button.getAttribute('data-code')); };
    });
    setupTypeTooltips(tooltip, '.type-icon');
    if (!refreshed) {
      window.scrollTo(0, 0);
      refreshStatsView(function () { renderAllTypes(back, true); });
    }
  }

  // 유형별 테스트 결과 건수. 만족/불만족 평가 건수와 별도로 집계합니다.
  var typeResultCounts = null;

  function renderTypeStats(back, refreshed) {
    var codes = Object.keys(RESULTS);
    var total = typeResultCounts ? codes.reduce(function (sum, code) { return sum + (typeResultCounts[code] || 0); }, 0) : 0;
    var rows = codes.map(function (code) {
      var r = RESULTS[code], pos = CHARACTER_POSITIONS[code];
      var count = typeResultCounts ? typeResultCounts[code] || 0 : null;
      var ratio = total ? count / total * 100 : 0;
      var value = count === null ? '비율 — · 결과건수 — (집계 전)' : ratio.toFixed(1) + '% · ' + count.toLocaleString('ko-KR') + '건';
      return '<div class="stats-row"><div class="stats-avatar"><button type="button" class="stats-icon' + (code === lastResultType ? ' last-result' : '') + '" data-code="' + code + '" aria-label="' + r[2] + ' 상세 보기">' +
        '<div class="character" style="background-position:' + (pos[0] * 100 / 3) + '% ' + (pos[1] * 100 / 3) + '%"></div></button>' + satisfaction(code).bar + '</div>' +
        '<div><div class="stats-track" role="img" aria-label="' + r[2] + ': ' + value + '"><span class="stats-fill" style="width:' + ratio + '%"></span></div><p class="stats-value">' + value + '</p></div></div>';
    }).join('');
    el('<section class="stats-page"><h1>약침타입 통계보기</h1><p class="foot">' + statsNotice() + '</p><div class="stats-list">' + rows + '</div>' +
      '<div class="satisfaction-tooltip" id="type-name-tooltip" role="tooltip" hidden></div>' +
      typeDialogMarkup() + '</section>');
    var tooltip = document.getElementById('type-name-tooltip');
    var openTypeDialog = setupTypeDialog(tooltip);
    Array.prototype.forEach.call(app.querySelectorAll('.stats-icon'), function (button) {
      button.onclick = function () { openTypeDialog(button.getAttribute('data-code')); };
    });
    setupTypeTooltips(tooltip, '.stats-icon');
    if (!refreshed) {
      window.scrollTo(0, 0);
      refreshStatsView(function () { renderTypeStats(back, true); });
    }
  }

  var shared = new URLSearchParams(location.search).get("type");
  shared = shared && shared.toUpperCase();
  if (shared && RESULTS[shared]) renderResult(shared); else renderStart();
})();
</script>

</body>
</html>
